<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Spring MVC Example</title>

    <style>
      td {
        padding: 10px;
      }
    </style>
  </head>

  <body>
    <h1>Liste des contacts à modifier</h1>

    <table border="2">
      <tr>
        <th>Id</th>
        <th>Nom</th>
        <th>Email</th>
        <th>Note</th>
        <th></th>
      </tr>

      <tr th:each="contact : ${contacts}">
        <td th:text="${contact.id}"></td>
        <td th:text="${contact.nom}" />
        <td th:text="${contact.email}" />
        <td th:text="${contact.note}" />
        <td>
          <a th:href="@{/modify(id=${contact.id})}"> Image de crayon </a>
        </td>
      </tr>
    </table>

    <h2><a href="/">Revenir à l'accueil</a></h2>
  </body>
</html>
