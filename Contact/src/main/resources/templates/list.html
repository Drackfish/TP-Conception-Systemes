<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Liste des contacts</title>
  </head>

  <body>
    <h1>Liste des contacts à modifier</h1>
    
    <h1><a href="/contacts">Voir tous les contacts</a> | <a href="/personnes">Gérer les personnes</a></h1>
    <h2><a href="ajoutContact">Ajouter un contact</a> | <a href="delete">Supprimer un contact</a></h2>
    
        <form action="/contacts" method="get">
          <label>Filtrer par note exacte : </label>
          <input type="number" name="noteExacte" min="0" max="20"/>
          <button type="submit">Chercher</button>
        </form>
    
        <form action="/contacts" method="get">
          <label>Contacts mal notés (note max) : </label>
          <input type="number" name="noteMax" value="2" min="0" max="20"/>
          <button type="submit">Filtrer</button>
        </form>
    
    <table border="2">
      <tr>
        <th>Email (Id)</th>
        <th>Nom</th>
        <th>Note</th>
        <th>Personne rattachée</th>
        <th>action</th>
      </tr>

      <tr th:each="contact : ${contacts}">
        <td th:text="${contact.email}"></td>
        <td th:text="${contact.nom}"></td>
        <td th:text="${contact.note}"></td>
        <td th:text="${contact.personne != null ? contact.personne.nom + ' ' + contact.prenom : 'Aucune'}"></td>
        <td>
          <a th:href="@{/modifyContact(email=${contact.email})}">Modifier</a> |
          <a th:href="@{/deleteContact(email=${contact.email})}">Supprimer</a>
      </tr>
    </table>

    <h2><a href="/">Revenir à l'accueil</a></h2>
  </body>
</html>
