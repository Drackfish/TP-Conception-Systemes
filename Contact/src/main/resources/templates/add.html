<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Ajout contact</title>
    <meta charset="utf-8" />
  </head>
  <body>
    <form action="/saveContacts" method="post">
      <label>Email du contact :</label>
      <input type="text" name="email" required /><br/>

      <label>Nom du contact :</label>
      <input type="text" name="nom" required /><br/>

      <label>Note :</label>
      <input type="number" name="note" min="0" max="20" required /><br/>

      <!-- Sélection de la personne associée -->
      <label>Personne :</label>
      <select name="personneId" required>
        <option value="">-- Choisissez une personne --</option>
        <!-- On parcourt la liste des personnes transmise par le contrôleur -->
        <th:block th:each="p : ${personnes}">
          <!-- La value envoie l'ID (Long) de la personne, et le texte affiche son nom/prénom -->
          <option th:value="${p.id}" th:text="${p.nom + ' ' + p.prenom}"></option>
        </th:block>
      </select>
      <br/>

      <button type="submit">Enregistrer le contact</button>
    </form>

    <h2><a href="/">Revenir à l'accueil</a></h2>
  </body>
</html>
