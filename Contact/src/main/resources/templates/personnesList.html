<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Gestion des Personnes</title>
  </head>

  <body>
    <h1>Liste des Personnes</h1>

    <!-- Liens vers les requêtes spécifiques demandées -->
    <p>
      <a href="/personnesSansContact">Personnes sans contact</a> | 
      <a href="/meilleureMoyenne">Personne avec la meilleure moyenne de notes</a> | 
      <a href="/contacts">Gérer les contacts</a>
    </p>

    <!-- Affichage du résultat de la meilleure moyenne si présent -->
    <div th:if="${meilleurePersonne != null}" style="background-color: #eef; padding: 10px; margin-bottom: 15px;">
      <h3>Personne ayant la moyenne de notes la plus élevée :</h3>
      <p>Nom : <span th:text="${meilleurePersonne.nom}"></span> <span th:text="${meilleurePersonne.prenom}"></span></p>
    </div>

    <!-- Formulaire d'ajout d'une personne -->
    <h3>Ajouter une personne</h3>
    <form action="/savePersonne" method="post">
      <label>Nom : </label><input type="text" name="nom" required /><br/>
      <label>Prénom : </label><input type="text" name="prenom" required /><br/>
      <label>Adresse : </label><input type="text" name="adresse" /><br/>
      <button type="submit">Ajouter</button>
    </form>

    <hr/>

    <!-- Tableau des personnes -->
    <table border="2">
      <tr>
        <th>ID</th>
        <th>Nom</th>
        <th>Prénom</th>
        <th>Adresse</th>
        <th>Contacts associés</th>
        <th>Actions</th>
      </tr>

      <tr th:each="p : ${personnes}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.nom}"></td>
        <td th:text="${p.prenom}"></td>
        <td th:text="${p.adresse}"></td>
        <td>
          <ul>
            <li th:each="c : ${p.contacts}" th:text="${c.nom + ' (' + c.email + ' - Note: ' + c.note + ')'}"></li>
          </ul>
        </td>
        <td>
          <a th:href="@{/deletePersonne(id=${p.id})}">Supprimer</a>
        </td>
      </tr>
    </table>

    <h2><a href="/">Revenir à l'accueil</a></h2>
  </body>
</html>
